<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop using JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        .container {
            width: 100%;
            height: 100vh;
            background-color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .left,
        .right {
            width: 300px;
            height: 400px;
            border: 4px dashed white;
            overflow-y: auto;
        }

        .list {
            font-family: Courier, monospace;
            color: rgb(0, 0, 0);
            background-color: yellow;
            height: 60px;
            margin: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="list" draggable="true">List item 1</div>
            <div class="list" draggable="true">List item 2</div>
            <div class="list" draggable="true">List item 3</div>
            <div class="list" draggable="true">List item 4</div>
        </div>
        <div class="right"></div>
    </div>

    <script>
        let lists = document.querySelectorAll('.list');
        let rightBox = document.querySelector('.right');
        let leftBox = document.querySelector('.left');
        let selected = null;

        // Drag start event
        lists.forEach((li) => {
            li.addEventListener('dragstart', (e) => {
                selected = e.target;
            });
        });

        // Right box dragover and drop
        rightBox.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        rightBox.addEventListener('drop', (e) => {
            if (selected) {
                rightBox.appendChild(selected);
                selected = null;
            }
        });

        // Left box dragover and drop
        leftBox.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        leftBox.addEventListener('drop', (e) => {
            if (selected) {
                leftBox.appendChild(selected);
                selected = null;
            }
        });
    </script>
</body>

</html>
